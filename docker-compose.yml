# Work League on one Docker host. Start: ADMIN_PASSWORD=… docker compose up -d
# The data is a SQLite file in the `league` volume; back it up by copying it.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD to unlock /admin}
      # The address people open in their browser.
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    volumes:
      - league:/data
    ports:
      - '3000:3000'

volumes:
  league:
