<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="description" content="%wl.description%" />

		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="icon" href="/brand/icon-192.png?v=%wl.assetVersion%" type="image/png" />
		<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png?v=%wl.assetVersion%" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="%wl.themeLight%" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="%wl.themeDark%" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="%wl.name%" />
		<style id="wl-theme">
			%wl.theme%
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
