name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run check
      - name: Lint and format
        run: npm run lint
      - name: Unit and database tests
        run: npm test
      - name: Build for Cloudflare
        run: npm run build
      - name: Build for Node
        run: npm run build:node
      - name: Migrations match the schema
        run: npx drizzle-kit generate | tee /dev/stderr | grep -q "No schema changes"
